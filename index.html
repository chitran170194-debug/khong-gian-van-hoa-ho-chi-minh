<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Không gian Văn hóa Hồ Chí Minh</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf6ff, #f5edff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #17365d;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            padding: 60px 30px;
            text-align: center;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
            color: #1261a0;
        }

        h2 {
            font-size: 24px;
            margin: 15px 0 35px;
            color: #7b4bb7;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 16px 35px;
            border-radius: 50px;
            background: linear-gradient(135deg, #2388d9, #8c55d9);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .note {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🏛️</div>

        <h1>KHÔNG GIAN VĂN HÓA HỒ CHÍ MINH</h1>

        <h2>TRƯỜNG TIỂU HỌC NGUYỄN TRỰC</h2>

        <p>
            Chào mừng bạn đến với Không gian Văn hóa Hồ Chí Minh
            trực tuyến.
        </p>

        <a href="#" class="button">
            BẮT ĐẦU THAM QUAN
        </a>

        <div class="note">
            Không gian đang được xây dựng...
        </div>

    </div>

</body>
</html>
